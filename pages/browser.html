<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:">
  <title>Litzium</title>
  <link rel="stylesheet" href="../theming/variables.css">
  <link rel="stylesheet" href="../theming/browser.css">
</head>
<body>
<div id="browser-chrome">

  <!-- ─── Tab bar ─────────────────────────────────────────────────────────── -->
  <div id="tab-bar">

    <div id="tabs-scroller">
      <div id="tabs-container"></div>
    </div>

    <button id="new-tab-btn" class="icon-btn" title="New Tab (Ctrl+T)" aria-label="New tab">
      <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"/>
      </svg>
    </button>

    <div id="window-controls">
      <button id="win-minimize" class="win-ctrl" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 10 1" fill="currentColor"><rect width="10" height="1"/></svg>
      </button>
      <button id="win-maximize" class="win-ctrl" title="Maximize" aria-label="Maximize">
        <svg id="ico-maximize" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1">
          <rect x=".5" y=".5" width="9" height="9"/>
        </svg>
        <svg id="ico-restore" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" style="display:none">
          <rect x="2.5" y=".5" width="7" height="7"/>
          <rect x=".5"  y="2.5" width="7" height="7"/>
        </svg>
      </button>
      <button id="win-close" class="win-ctrl win-close-btn" title="Close" aria-label="Close">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <line x1=".5" y1=".5" x2="9.5" y2="9.5"/>
          <line x1="9.5" y1=".5" x2=".5" y2="9.5"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ─── Nav bar ──────────────────────────────────────────────────────────── -->
  <div id="nav-bar">

    <div class="nav-group">
      <button id="back-btn" class="icon-btn nav-btn" title="Back (Alt+←)" aria-label="Go back" disabled>
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/>
        </svg>
      </button>
      <button id="forward-btn" class="icon-btn nav-btn" title="Forward (Alt+→)" aria-label="Go forward" disabled>
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
      </button>
      <button id="reload-btn" class="icon-btn nav-btn" title="Reload (Ctrl+R)" aria-label="Reload">
        <svg id="ico-reload" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/>
        </svg>
        <svg id="ico-stop" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" style="display:none">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
      </button>
    </div>

    <!-- Omnibox -->
    <div id="omnibox">
      <div id="page-icon" aria-hidden="true">
        <svg id="ico-globe" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM4.332 8.027a6.012 6.012 0 011.912-2.706C6.512 5.73 6.974 6 7.5 6A1.5 1.5 0 019 7.5V8a2 2 0 004 0 2 2 0 011.523-1.943A5.977 5.977 0 0116 10c0 .34-.028.675-.083 1H15a2 2 0 00-2 2v2.197A5.973 5.973 0 0110 16v-2a2 2 0 00-2-2 2 2 0 01-2-2 2 2 0 00-1.668-1.973z" clip-rule="evenodd"/>
        </svg>
        <svg id="ico-lock" viewBox="0 0 20 20" fill="currentColor" style="display:none">
          <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
        </svg>
        <img id="ico-favicon" src="" alt="" style="display:none" width="16" height="16" referrerpolicy="no-referrer">
      </div>

      <!-- Zoom pill — visible when zoom ≠ 100% -->
      <button id="zoom-pill" class="zoom-pill" title="Click to reset zoom (Ctrl+0)" hidden aria-label="Reset zoom">
        <span id="zoom-label">100%</span>
      </button>

      <input
        id="address-bar"
        type="text"
        placeholder="Search or enter an address"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Address bar"
      >

      <!-- Bookmark star -->
      <button id="star-btn" class="icon-btn star-btn" title="Bookmark this page" aria-label="Bookmark" aria-pressed="false">
        <!-- Outline star (not bookmarked) -->
        <svg id="ico-star-empty" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
        </svg>
        <!-- Filled star (bookmarked) -->
        <svg id="ico-star-filled" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" style="display:none">
          <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
        </svg>
      </button>
    </div><!-- #omnibox -->

    <div class="nav-group">
      <!-- Download badge -->
      <button id="dl-btn" class="icon-btn nav-btn dl-btn" title="Downloads" aria-label="Downloads" hidden>
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
        <span id="dl-badge" class="dl-badge"></span>
      </button>
      <button id="devtools-btn" class="icon-btn nav-btn" title="DevTools (F12)" aria-label="Open DevTools">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M12.316 3.051a1 1 0 01.633 1.265l-4 12a1 1 0 11-1.898-.632l4-12a1 1 0 011.265-.633zM5.707 6.293a1 1 0 010 1.414L3.414 10l2.293 2.293a1 1 0 11-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0zm8.586 0a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 11-1.414-1.414L16.586 10l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
      </button>
      <button id="settings-btn" class="icon-btn nav-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
        </svg>
      </button>
    </div>
  </div><!-- #nav-bar -->

  <div id="progress-bar" aria-hidden="true">
    <div id="progress-fill"></div>
  </div>

  <!-- Find bar — expands below progress bar when Ctrl+F is pressed -->
  <div id="find-bar" aria-label="Find in page" hidden>
    <svg class="find-bar-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
    </svg>
    <input
      id="find-input"
      type="text"
      placeholder="Find in page…"
      autocomplete="off"
      spellcheck="false"
      aria-label="Find"
    >
    <span id="find-count" class="find-count"></span>
    <div class="find-nav">
      <button id="find-prev" class="icon-btn find-nav-btn" title="Previous (Shift+Enter)" aria-label="Previous match">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M14.707 12.707a1 1 0 01-1.414 0L10 9.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
      </button>
      <button id="find-next" class="icon-btn find-nav-btn" title="Next (Enter)" aria-label="Next match">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
      </button>
    </div>
    <button id="find-close" class="icon-btn find-close-btn" title="Close (Esc)" aria-label="Close find bar">
      <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
    </button>
  </div>

  <!-- Autocomplete dropdown -->
  <div id="suggestions-dropdown" role="listbox" aria-label="Search suggestions" hidden></div>

</div><!-- #browser-chrome -->

<script src="../javas/renderer/browser.js"></script>
</body>
</html>
