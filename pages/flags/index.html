<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flags — Litzium</title>
  <link rel="stylesheet" href="../../theming/internal.css">
  <style>
    .flags-warning {
      background: rgba(251, 191, 36, 0.08);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 13px;
      color: var(--warn);
      margin-bottom: 24px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .flags-warning .warn-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

    .flag-category { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); padding: 14px 16px 6px; }

    .flag-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 16px;
      border-top: 1px solid var(--border);
    }

    .flag-row:first-of-type { border-top: none; }

    .flag-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .flag-body  { flex: 1; min-width: 0; }
    .flag-name  { font-size: 13px; font-weight: 500; color: var(--text); }
    .flag-desc  { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .flag-key   { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 3px; }

    .flag-control { flex-shrink: 0; display: flex; align-items: center; gap: 8px; }

    .search-wrap { margin-bottom: 20px; }

    #flag-count { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  </style>
</head>
<body>
<div class="ip-page">

  <div class="ip-breadcrumb">
    <a href="litzium://litz-urls">litzium URLs</a>
    <span class="sep">›</span>
    <span>Flags</span>
  </div>

  <div class="ip-header">
    <h1>Flags <span class="ip-badge experimental" style="vertical-align:middle;font-size:11px">Experimental</span></h1>
    <p class="ip-subtitle">In-development and experimental features. Changes take effect after restarting.</p>
  </div>

  <div class="flags-warning">
    <span class="warn-icon">⚠️</span>
    <span>These features are not guaranteed to work correctly. Enabling them may cause instability or data loss. Use at your own risk.</span>
  </div>

  <div class="search-wrap">
    <input class="ip-search" id="flag-search" placeholder="Search flags…" autocomplete="off">
    <div id="flag-count"></div>
  </div>

  <div class="ip-card" id="flags-list"></div>

</div>
<script>
  const FLAGS = [
    // ── Rendering ──────────────────────────────────────────────────────────────
    { category: 'Rendering', icon: '🖥️', name: 'Hardware Acceleration', key: 'hardware-acceleration',
      desc: 'Use the GPU to accelerate rendering. Disable if you experience graphical glitches.', default: true },
    { category: 'Rendering', icon: '✨', name: 'Smooth Scrolling', key: 'smooth-scrolling',
      desc: 'Animate page scrolling for a smoother feel.', default: true },
    { category: 'Rendering', icon: '🌓', name: 'Force Dark Mode for Web Content', key: 'force-dark-mode',
      desc: 'Apply a dark colour scheme to websites that don\'t natively support it.', default: false },

    // ── Performance ────────────────────────────────────────────────────────────
    { category: 'Performance', icon: '💤', name: 'Tab Sleeping', key: 'tab-sleep',
      desc: 'Suspend background tabs after a period of inactivity to save memory.', default: false },
    { category: 'Performance', icon: '🗂️', name: 'Tab Groups', key: 'tab-groups',
      desc: 'Organise tabs into named, colour-coded groups.', default: false },

    // ── Privacy ────────────────────────────────────────────────────────────────
    { category: 'Privacy', icon: '🛡️', name: 'Enhanced Tracking Protection', key: 'tracking-protection',
      desc: 'Block known trackers, analytics, and fingerprinting scripts.', default: false },
    { category: 'Privacy', icon: '🕵️', name: 'Private Browsing Indicator', key: 'private-indicator',
      desc: 'Show a badge in the address bar when a page is visited in private mode.', default: false },

    // ── UI ─────────────────────────────────────────────────────────────────────
    { category: 'UI', icon: '📖', name: 'Reading Mode', key: 'reading-mode',
      desc: 'Strip page clutter and display articles in a clean, readable format.', default: false },
    { category: 'UI', icon: '🖼️', name: 'Picture-in-Picture', key: 'pip',
      desc: 'Float video players in a small overlay window above other content.', default: false },
    { category: 'UI', icon: '⌨️', name: 'Keyboard Shortcuts Overlay', key: 'shortcuts-overlay',
      desc: 'Show a shortcut reference panel when pressing Ctrl+/.', default: false },

    // ── Developer ──────────────────────────────────────────────────────────────
    { category: 'Developer', icon: '🔍', name: 'Source Viewer', key: 'source-viewer',
      desc: 'Navigate to view-source: URLs to see page HTML with syntax highlighting.', default: false },
    { category: 'Developer', icon: '📡', name: 'Network Log', key: 'network-log',
      desc: 'Record all network requests to litzium://debug.', default: false },
  ]

  // Load saved states from localStorage
  function getState(key) {
    const saved = localStorage.getItem('flag:' + key)
    if (saved !== null) return saved === 'true'
    return FLAGS.find(f => f.key === key)?.default ?? false
  }

  function setState(key, val) {
    localStorage.setItem('flag:' + key, String(val))
  }

  const container = document.getElementById('flags-list')
  let lastCategory = null

  function render(flags) {
    container.innerHTML = ''
    lastCategory = null

    if (flags.length === 0) {
      container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--sub);font-size:13px">No flags match your search.</div>'
      return
    }

    flags.forEach(f => {
      if (f.category !== lastCategory) {
        const cat = document.createElement('div')
        cat.className = 'flag-category'
        cat.textContent = f.category
        container.appendChild(cat)
        lastCategory = f.category
      }

      const row = document.createElement('div')
      row.className = 'flag-row'
      row.dataset.key = f.key
      row.innerHTML = `
        <div class="flag-icon">${f.icon}</div>
        <div class="flag-body">
          <div class="flag-name">${f.name}</div>
          <div class="flag-desc">${f.desc}</div>
          <div class="flag-key">#${f.key}</div>
        </div>
        <div class="flag-control">
          <label class="ip-toggle">
            <input type="checkbox" ${getState(f.key) ? 'checked' : ''} data-key="${f.key}">
            <span class="ip-toggle-track"></span>
          </label>
        </div>`
      container.appendChild(row)
    })
  }

  render(FLAGS)
  document.getElementById('flag-count').textContent = FLAGS.length + ' flags'

  // Toggle handler
  container.addEventListener('change', e => {
    if (e.target.type === 'checkbox' && e.target.dataset.key) {
      setState(e.target.dataset.key, e.target.checked)
    }
  })

  // Search
  document.getElementById('flag-search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase()
    const filtered = q ? FLAGS.filter(f =>
      f.name.toLowerCase().includes(q) ||
      f.desc.toLowerCase().includes(q) ||
      f.key.toLowerCase().includes(q)
    ) : FLAGS
    render(filtered)
    document.getElementById('flag-count').textContent =
      filtered.length === FLAGS.length ? FLAGS.length + ' flags' : `${filtered.length} of ${FLAGS.length} flags`
  })
</script>
</body>
</html>
