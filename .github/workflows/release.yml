name: Release

# ─────────────────────────────────────────────────────────────────────────────
# Runs whenever a version tag (v*) is pushed, e.g. git tag v4.00 && git push --tags
# Also supports manual dispatch from the Actions tab.
# Builds Windows (NSIS), macOS (DMG), and Linux (AppImage + deb) installers
# and attaches them all to the GitHub Release.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag / version to build (e.g. v4.00)"
        required: false
        default: ""

permissions:
  contents: write   # needed to create/update Releases and upload assets

jobs:
  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate installer
        id: find_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "*.exe" -Recurse |
                 Where-Object { $_.Name -notlike "*unpacked*" } |
                 Select-Object -First 1
          if (-not $exe) { Write-Error "No .exe found in dist/"; exit 1 }
          Write-Host "Found: $($exe.FullName)"
          "path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($exe.Name)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ steps.find_exe.outputs.path }}
          retention-days: 1

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate DMG
        id: find_dmg
        run: |
          DMG=$(find dist -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then echo "No .dmg found in dist/"; exit 1; fi
          echo "Found: $DMG"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: ${{ steps.find_dmg.outputs.path }}
          retention-days: 1

  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Build Linux packages
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate Linux packages
        id: find_linux
        run: |
          APPIMAGE=$(find dist -name "*.AppImage" | head -1)
          DEB=$(find dist -name "*.deb" | head -1)
          if [ -z "$APPIMAGE" ] && [ -z "$DEB" ]; then
            echo "No Linux packages found in dist/"; exit 1
          fi
          echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "deb=$DEB"           >> "$GITHUB_OUTPUT"
          echo "Found AppImage: $APPIMAGE"
          echo "Found deb: $DEB"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            ${{ steps.find_linux.outputs.appimage }}
            ${{ steps.find_linux.outputs.deb }}
          retention-days: 1

  # ── Release ────────────────────────────────────────────────────────────────
  publish-release:
    name: Create GitHub Release
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: find release-assets -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: "Litzium ${{ github.ref_name || inputs.tag }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
